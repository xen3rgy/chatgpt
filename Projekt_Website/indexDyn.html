<script>
function fillTableOfContents() 
{        
    // create an HTTP GET request to the server
    var request = new XMLHttpRequest();
    request.onreadystatechange = function () {
        if (this.readyState === 4 && this.status === 200) 
        {
            console.log(this.responseText);
            let json = JSON.parse(this.responseText);
            var inner="";
            json.forEach(element => {
                model = element.model;
                year = element.year;
                // only first line of historical info and trim numbering
                const lines = element.historical.split('\n').filter(line => line.trim() !== '');
                historical = "";
                if (lines != null && lines[0] != null)
                {
                    historical = lines[0].trim();           
                    if(historical.startsWith("1."))
                    {
                        historical = historical.slice(2);
                    }
                }
                
                const entry = `
<div class="col-md-4 entry" data-tags="${element.manufacturer} ${year}">
    <div class="card">
        <div class="card-body">
        <h5 class="card-title"><a href="device.html?lang=1031&device=${element.name}"><span id="title_0">${model} (${year})</span></a><button class="btn btn-sm btn-outline-primary admin-edit" onclick="editField('title_0')" style="display:none;">✏️</button></h5>
        <p class="card-text"><span id="text_0">${historical}</span><button class="btn btn-sm btn-outline-primary admin-edit" onclick="editField('text_0')" style="display:none;">✏️</button></p>
        </div>
    </div>
</div>`;
                console.log(entry);
                inner = inner + entry;
                }
            );
            
            setHTML(inner,"entries");
            adjustVisuals();
        }
    }
    const params = new URLSearchParams(window.location.search);
    lang = params.get("lang");
    if (lang==null)
        lang = 1031;

    request.open('GET', 'getdeviceinfo.php?lang=' +lang, true);
    request.send();
}
fillTableOfContents();
</script>
