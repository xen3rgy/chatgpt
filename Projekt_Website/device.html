<script>
   function getList(text, outputDivName, textId) 
   {
      const lines = text.split('\n').filter(line => line.trim() !== '');
      var list = `<button class="btn btn-sm btn-outline-primary admin-edit ms-2" onclick="editField('${outputDivName}_content')" style="display:none;">✏️</button>
      <ul id="${outputDivName}_content" data-textId="${textId}">`;

        /*
<li><span id="tech_0">Prozessor: Intel 8080 @ 2 MHz</span><button class="btn btn-sm btn-outline-primary admin-edit ms-2" onclick="editField('tech_0')" style="display:none;">✏️</button></li>
<li><span id="tech_1">RAM: 256 Byte (erweiterbar bis 64 KB)</span><button class="btn btn-sm btn-outline-primary admin-edit ms-2" onclick="editField('tech_1')" style="display:none;">✏️</button></li>
<li><span id="tech_2">Bedienung über Kippschalter &amp; LED-Anzeige</span><button class="btn btn-sm btn-outline-primary admin-edit ms-2" onclick="editField('tech_2')" style="display:none;">✏️</button></li>
<li><span id="tech_3">S-100 Bus zur Erweiterung</span><button class="btn btn-sm btn-outline-primary admin-edit ms-2" onclick="editField('tech_3')" style="display:none;">✏️</button></li>
        */
      lines.forEach(line => 
      {
        let formattedLine = line;

        const colonIndex = line.indexOf(':');
        if (colonIndex !== -1) {
          const key = line.slice(0, colonIndex).trim();
          const value = line.slice(colonIndex + 1).trim();
          formattedLine = `<strong>${key}:</strong> ${value}`;
          //console.log(formattedLine);
        }

        list += `<li>${formattedLine}</li>`;
      });
      list += "</ul>";
      setHTML(list, outputDivName,textId);
    }

    function readData(lcid) 
    {
        // create an HTTP GET request to the server
        var request = new XMLHttpRequest();
        request.onreadystatechange = function () {
            if (this.readyState === 4 && this.status === 200) 
            {
              //document.getElementById("status").innerHTML=this.responseText;
              //alert(this.responseText);
              console.log(this.responseText);
              let json = JSON.parse(this.responseText);
              setHTML(json[0].model, "title",0);
              setHTML(json[0].model, "model",0);
              //document.getElementById("image").src = "devices/" + json[0].model + ".jpg"
              setHTML(json[0].manufacturer, "manufacturer",json[0].id+"_manufacturer");
              getList(json[0].technical, "technicalData",json[0].technical_textid);
              getList(json[0].historical, "historical",json[0].historical_textid);
              getList(json[0].general, "general",json[0].general_textid);
              getList(json[0].special, "special",json[0].special_textid);
            }
            applyAdminMode(); //if admin mode is set -> apply it
        }
        const params = new URLSearchParams(window.location.search);
        const device = params.get("device");
         
        lcid = setLCID(lcid);

        if(lcid==1033)
        {
          setHTML("Manufacturer: ","header_manufacturer",0);
          setHTML("Technical data","header_technical",0);
          setHTML("Historical significance","header_historical",0);
          setHTML("General data","header_general",0);
          setHTML("Special features","header_special",0);
        }
        else
        {
          setHTML("Hersteller: ","header_manufacturer",0);
          setHTML("Technische Daten","header_technical",0);
          setHTML("Historische Bedeutung","header_historical",0);
          setHTML("Allgemeine Informationen","header_general",0);
          setHTML("Besonderheiten","header_special",0);
        }

        image = document.getElementById("image");
        imagename = device.replace('/','_'); //remove invalid characters for filename
        image.src = "devices/" + imagename + ".jpg";
        image.alt = image.src;

        request.open('GET', 'getdeviceinfo.php?lcid=' +lcid+'&device=' + device, true);
        request.send();
    }
    readData(null);
</script>
